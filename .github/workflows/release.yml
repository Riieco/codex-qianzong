name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 1.5.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.commit.outputs.source_sha }}

    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this release workflow from the main branch."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate version and tag
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must look like 1.5.3 or 1.5.3-rc.1."
            exit 1
          fi

          tag="v$version"
          if git show-ref --tags --verify --quiet "refs/tags/$tag"; then
            echo "::error::Tag $tag already exists. Choose a new version."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Choose a new version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install formatting dependencies
        run: npm ci

      - name: Update project version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/set-release-version.mjs "$RELEASE_VERSION"
          npx prettier --write package.json package-lock.json src-tauri/tauri.conf.json

      - name: Commit release version
        id: commit
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare $RELEASE_TAG"
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    name: Test release source
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-test-windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Run frontend lint
        run: npm run lint

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    name: Build Windows x64 MSI
    needs:
      - prepare
      - test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-build-windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Build MSI installer
        run: npm run tauri build -- --bundles msi

      - name: Collect MSI installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -File | Select-Object -First 1
          if (-not $msi) {
            throw "Tauri did not produce an MSI installer."
          }

          New-Item -ItemType Directory -Force "dist-artifacts" | Out-Null
          Copy-Item $msi.FullName "dist-artifacts/codex-qianzong_${env:RELEASE_VERSION}_x64.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64-msi
          path: dist-artifacts/codex-qianzong_${{ needs.prepare.outputs.version }}_x64.msi
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ${{ matrix.name }} DMG
    needs:
      - prepare
      - test
    runs-on: macos-14
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            target: aarch64-apple-darwin
            arch: aarch64
          - name: Intel
            target: x86_64-apple-darwin
            arch: x86_64

    env:
      MACOS_TARGET: ${{ matrix.target }}
      MACOS_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-build-${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS application
        run: npm run tauri build -- --target "$MACOS_TARGET" --bundles app

      - name: Ad-hoc sign application
        run: codesign --force --deep --sign - "src-tauri/target/$MACOS_TARGET/release/bundle/macos/codex-qianzong.app"

      - name: Create DMG
        shell: bash
        run: |
          mkdir -p dist-artifacts
          DMG_ROOT="$(mktemp -d "$RUNNER_TEMP/codex-qianzong-dmg.XXXXXX")"

          ditto \
            "src-tauri/target/$MACOS_TARGET/release/bundle/macos/codex-qianzong.app" \
            "$DMG_ROOT/codex-qianzong.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          hdiutil create \
            -volname codex-qianzong \
            -srcfolder "$DMG_ROOT" \
            -format UDZO \
            "dist-artifacts/codex-qianzong_${RELEASE_VERSION}_${MACOS_ARCH}.dmg"

      - name: Verify DMG installer layout
        shell: bash
        run: |
          DMG_PATH="dist-artifacts/codex-qianzong_${RELEASE_VERSION}_${MACOS_ARCH}.dmg"
          MOUNT_POINT="$(mktemp -d "$RUNNER_TEMP/codex-qianzong-mount.XXXXXX")"

          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$DMG_PATH"
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true' EXIT

          test -d "$MOUNT_POINT/codex-qianzong.app"
          test -L "$MOUNT_POINT/Applications"
          test "$(readlink "$MOUNT_POINT/Applications")" = "/Applications"

          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}-dmg
          path: dist-artifacts/codex-qianzong_${{ needs.prepare.outputs.version }}_${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Update README and publish GitHub Release
    needs:
      - prepare
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Compute SHA-256 and update README
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/update-release-readme.mjs "$RELEASE_VERSION" release-assets

      - name: Commit README verification block
        id: readme
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]]; then
            echo "::error::main changed during the release build. Re-run after resolving the new commits."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: add $RELEASE_TAG release checksums"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.readme.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "codex-qianzong $RELEASE_TAG" \
            --notes-file release-notes.md
